spring:
  application:
    name: deposit-service

  datasource:
    url: jdbc:postgresql://${DEPOSIT_DB_HOST:localhost}:${DEPOSIT_DB_PORT:5433}/${DEPOSIT_DB_NAME:deposit_db}
    username: ${DEPOSIT_DB_USER:deposit}
    password: ${DEPOSIT_DB_PASSWORD:deposit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8082
  servlet:
    context-path: /api

logging:
  level:
    com.bank.deposit: DEBUG
    org.springframework.web: INFO
