server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: C:/loki-data/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: customer-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: customer-service
          application: customer-service
          __path__: C:/logs/internet-banking/customer-service.log
    pipeline_stages:
      - regex:
          expression: '.* \[.*\] (?P<level>INFO|WARN|ERROR|DEBUG) .*'
      - labels:
          level:
