name: Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[skip review]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR diff 수집
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.java' '*.gradle' '*.yml' '*.yaml' \
            | head -c 12000 > /tmp/pr_diff.txt

          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
          fi

      - name: Claude API 호출
        if: steps.diff.outputs.empty == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          diff = open('/tmp/pr_diff.txt').read()
          pr_title = os.environ['PR_TITLE']
          api_key = os.environ['ANTHROPIC_API_KEY'].strip()

          system_prompt = """당신은 Java 17 / Spring Boot 3.x 기반 인터넷뱅킹 프로젝트의 자동 코드 리뷰어입니다.
          변경된 코드(diff)만 보고 리뷰하며, diff에 없는 내용은 추측하지 않습니다.

          ## 리뷰 기준 (AI_GUIDELINES.md 기반)

          🔴 차단 — 반드시 지적:
          - 보안: API 키/비밀번호 하드코딩, SQL Injection (${} 사용), .env 파일 노출
          - 금융: double/float으로 금액 계산(BigDecimal 강제), 하드 DELETE(소프트 삭제 강제), 금액 비교에 equals() 사용
          - 예외: catch (Exception e) 광범위 catch, 예외 로깅 없이 삼키기
          - 의존: 서비스 간 직접 Java import (예: loan 패키지에서 payment 패키지 직접 import)

          🟡 권고 — 수정 권장:
          - SQL/JPA: SELECT *, N+1 쿼리, @Transactional이 controller에 있음, 페이징 없는 findAll
          - 성능: 트랜잭션 내 외부 API 호출, TTL 없는 캐시 설정
          - 로깅: 민감정보(주민번호/계좌번호) 마스킹 없이 로깅, ERROR 레벨 남용
          - Lombok: @Data 또는 @AllArgsConstructor 사용, JPA 엔티티에 @Setter

          🟢 참고 — 선택적 개선:
          - 스타일 권고, 가독성 개선 제안

          ## 출력 형식 (반드시 아래 마크다운 형식으로)

          ## 자동 코드 리뷰 결과

          ### 🔴 차단 (머지 전 반드시 수정)
          - `파일명:라인번호` — 지적 내용 (AI_GUIDELINES §섹션번호)

          ### 🟡 권고 (수정 권장)
          - `파일명:라인번호` — 지적 내용 (AI_GUIDELINES §섹션번호)

          ### 🟢 참고 (선택 사항)
          - `파일명:라인번호` — 제안 내용

          ---
          리뷰 기준: AI_GUIDELINES.md | 모델: claude-sonnet-4-6

          지적 사항이 없는 섹션은 생략하고, 모든 섹션이 비어 있으면 "✅ 검토 완료 — 지적 사항 없음"을 출력합니다."""

          payload = {
              "model": "claude-sonnet-4-6",
              "max_tokens": 2048,
              "system": system_prompt,
              "messages": [
                  {
                      "role": "user",
                      "content": f"PR 제목: {pr_title}\n\n변경 코드:\n```diff\n{diff}\n```\n\n위 코드를 리뷰해주세요."
                  }
              ]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json"
              }
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  review = result["content"][0]["text"]
                  open("/tmp/review.txt", "w").write(review)
          except urllib.error.HTTPError as e:
              print(f"API 오류: {e.code} {e.reason}", file=sys.stderr)
              print(e.read().decode(), file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: PR 코멘트 게시
        if: steps.diff.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file /tmp/review.txt \
            --repo ${{ github.repository }}
